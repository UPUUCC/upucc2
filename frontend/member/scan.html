<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi QR - UPU-CC</title>

  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; }
    .scan-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 40px 0 60px;
      text-align: center;
    }
    .scanner-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        padding: 30px;
        border: none;
        max-width: 500px;
        margin: -40px auto 0;
        position: relative;
        z-index: 10;
    }
    #reader {
        width: 100%;
        border-radius: 10px;
        overflow: hidden;
        border: 2px dashed #cbd5e1;
    }
  </style>

  <link rel="canonical" href="https://upucc.or.id/member/scan.html">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <img src="/logo.jpg" alt="Logo UPU-CC" height="30" class="me-2 rounded-circle"> UPU-CC
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#memberNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="memberNavbar">
      <div class="d-flex flex-column flex-lg-row align-items-lg-center ms-auto gap-2 mt-3 mt-lg-0">
          <a href="/" class="btn btn-sm btn-outline-light text-start"><i class="bi bi-house"></i> Beranda</a>
          <a href="/member/dashboard.html" class="btn btn-sm btn-outline-light text-start"><i class="bi bi-arrow-left"></i> Kembali</a>
      </div>
    </div>
  </div>
</nav>

<div class="scan-header">
  <div class="container">
    <h2 class="fw-bold mb-1">Absensi Digital</h2>
    <p class="opacity-75">Arahkan kamera ke QR Code acara</p>
  </div>
</div>

<div class="container mb-5">
    <div class="scanner-card text-center">
        <div id="reader"></div>
        <div class="mt-4" id="scanResult" style="display: none;">
            <div class="alert alert-success d-flex align-items-center" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0 me-2 fs-4"></i>
                <div class="text-start">
                    <h6 class="fw-bold mb-0">Absensi Berhasil!</h6>
                    <small id="eventName">Pertemuan Rutin Mingguan</small>
                </div>
            </div>
            <button class="btn btn-outline-primary mt-2 w-100" id="btnScanAgain">Scan Ulang</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Include HTML5-QRCode Library -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script type="module" src="/src/member/scan.js"></script>
<script src="/src/protect.js"></script>
</body>
</html>
