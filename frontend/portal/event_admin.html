<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Event - UPU-CC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; font-family: 'Outfit', sans-serif; }
    .qr-container { background: white; padding: 2rem; border-radius: 16px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  </style>

  <link rel="canonical" href="https://upucc.or.id/portal/event_admin.html">
</head>
<body>
<div class="container py-5 text-center">
  <h2 class="fw-bold mb-4">Generator QR Code Event</h2>
  
  <div class="card border-0 shadow-sm mx-auto mb-4 p-4" style="max-width: 500px;">
    <div class="mb-3 text-start">
        <label class="form-label fw-bold">Nama Event</label>
        <input type="text" id="inputEventName" class="form-control" placeholder="Contoh: Kumpul Divisi Programming">
    </div>
    <button class="btn btn-primary w-100 fw-bold" id="btnGenerate">Generate QR Code Absensi</button>
  </div>

  <div id="qrResult" class="qr-container" style="display: none;">
      <h5 class="fw-bold text-primary mb-3" id="eventNameDisplay"></h5>
      <!-- QR Code will be generated here -->
      <div id="qrcode"></div>
      <p class="text-muted mt-3 small">Minta anggota untuk scan QR ini dari dashboard mereka.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    document.getElementById('btnGenerate').addEventListener('click', () => {
        const eventName = document.getElementById('inputEventName').value || 'Acara UPU-CC';
        const qrContainer = document.getElementById('qrcode');
        const qrResult = document.getElementById('qrResult');
        const eventNameDisplay = document.getElementById('eventNameDisplay');
        
        qrContainer.innerHTML = '';
        
        const randomEventId = 'EVT-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        
        new QRCode(qrContainer, {
            text: JSON.stringify({ id: randomEventId, name: eventName }),
            width: 250,
            height: 250,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
        
        eventNameDisplay.textContent = eventName;
        qrResult.style.display = 'inline-block';
    });
</script>
<script src="/src/protect.js"></script>
</body>
</html>
